<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset - Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            background: #007cba;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #005a8b;
        }

        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .section {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <h1>Password Reset Test Page</h1>

    <!-- Forgot Password Form -->
    <div class="section">
        <h2>1. Request Password Reset</h2>
        <form id="forgotForm">
            <div class="form-group">
                <label for="forgotEmail">Email:</label>
                <input type="email" id="forgotEmail" value="test@example.com" required>
            </div>
            <button type="submit">Send Reset Link</button>
        </form>
        <div id="forgotMessage"></div>
    </div>

    <!-- Reset Password Form -->
    <div class="section">
        <h2>2. Reset Password</h2>
        <form id="resetForm">
            <div class="form-group">
                <label for="resetToken">Reset Token:</label>
                <input type="text" id="resetToken" placeholder="Paste token from URL/email here" required>
            </div>
            <div class="form-group">
                <label for="resetEmail">Email:</label>
                <input type="email" id="resetEmail" value="test@example.com" required>
            </div>
            <div class="form-group">
                <label for="newPassword">New Password:</label>
                <input type="password" id="newPassword" placeholder="At least 8 characters" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" placeholder="Repeat new password" required>
            </div>
            <button type="submit">Reset Password</button>
        </form>
        <div id="resetMessage"></div>
    </div>

    <!-- Test Login Form -->
    <div class="section">
        <h2>3. Test Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email:</label>
                <input type="email" id="loginEmail" value="test@example.com" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword" placeholder="Use your new password" required>
            </div>
            <button type="submit">Test Login</button>
        </form>
        <div id="loginMessage"></div>
    </div>

    <script>
        const apiBase = 'http://localhost:8080/api';

        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('token')) {
            document.getElementById('resetToken').value = urlParams.get('token');
        }
        if (urlParams.get('email')) {
            document.getElementById('resetEmail').value = urlParams.get('email');
        }

        // Forgot Password
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value;

            try {
                const response = await fetch(`${apiBase}/auth/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();
                const messageDiv = document.getElementById('forgotMessage');

                if (response.ok) {
                    messageDiv.innerHTML = `<div class="message success">${data.message}</div>`;
                } else {
                    messageDiv.innerHTML = `<div class="message error">${data.message || 'Error occurred'}</div>`;
                }
            } catch (error) {
                document.getElementById('forgotMessage').innerHTML = `<div class="message error">Network error: ${error.message}</div>`;
            }
        });

        // Reset Password
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = document.getElementById('resetToken').value;
            const email = document.getElementById('resetEmail').value;
            const password = document.getElementById('newPassword').value;
            const password_confirmation = document.getElementById('confirmPassword').value;

            if (password !== password_confirmation) {
                document.getElementById('resetMessage').innerHTML = '<div class="message error">Passwords do not match!</div>';
                return;
            }

            try {
                const response = await fetch(`${apiBase}/auth/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ token, email, password, password_confirmation })
                });

                const data = await response.json();
                const messageDiv = document.getElementById('resetMessage');

                if (response.ok) {
                    messageDiv.innerHTML = `<div class="message success">${data.message}</div>`;
                    // Clear form
                    document.getElementById('resetForm').reset();
                } else {
                    let errorMsg = data.message || 'Error occurred';
                    if (data.errors) {
                        errorMsg += '<ul>';
                        Object.values(data.errors).flat().forEach(err => {
                            errorMsg += `<li>${err}</li>`;
                        });
                        errorMsg += '</ul>';
                    }
                    messageDiv.innerHTML = `<div class="message error">${errorMsg}</div>`;
                }
            } catch (error) {
                document.getElementById('resetMessage').innerHTML = `<div class="message error">Network error: ${error.message}</div>`;
            }
        });

        // Test Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${apiBase}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                const messageDiv = document.getElementById('loginMessage');

                if (response.ok) {
                    messageDiv.innerHTML = `<div class="message success">Login successful! Token: ${data.access_token.substring(0, 20)}...</div>`;
                } else {
                    messageDiv.innerHTML = `<div class="message error">${data.message || 'Login failed'}</div>`;
                }
            } catch (error) {
                document.getElementById('loginMessage').innerHTML = `<div class="message error">Network error: ${error.message}</div>`;
            }
        });
    </script>
</body>

</html>
