version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gespriority-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - gespriority-network
    depends_on:
      - db
    environment:
      - PHP_IDE_CONFIG=serverName=Docker

  nginx:
    image: nginx:alpine
    container_name: gespriority-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gespriority-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: gespriority-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gespriority_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: gespriority
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - gespriority-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gespriority-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    networks:
      - gespriority-network
    depends_on:
      - db

volumes:
  dbdata:
    driver: local

networks:
  gespriority-network:
    driver: bridge
